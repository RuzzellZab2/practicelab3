<h1>Мои курсы</h1>
<div id="courses-list"></div>
<div class="card">
  <h2>Создать курс</h2>
  <form id="create-course-form">
    <label class="field">
      <span class="field__label">Название</span>
      <input id="course-title-input" class="input" type="text" placeholder="Например: Основы SQL">
    </label>
    <label class="field">
      <span class="field__label">Описание</span>
      <textarea id="course-desc-input" class="input" rows="3" placeholder="О чём этот курс"></textarea>
    </label>
    <button type="submit" class="btn btn--primary">Создать курс</button>
  </form>
</div>
