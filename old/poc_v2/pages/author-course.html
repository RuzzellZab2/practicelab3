<h1 id="ac-title">Курс</h1>
<div id="ac-status" class="mb"></div>
<div class="card">
  <div id="ac-reviewer"></div>
</div>
<div class="card">
  <h2>Уроки курса</h2>
  <ul id="ac-lessons" class="lesson-list"></ul>
</div>
<div class="card">
  <h2>Добавить урок на курс</h2>
  <form id="add-lesson-form">
    <label class="field">
      <span class="field__label">Название урока</span>
      <input id="lesson-title-input" class="input" type="text" placeholder="Например: Введение в SQL">
    </label>
    <button type="submit" class="btn btn--primary">Добавить урок</button>
  </form>
</div>
<div class="card">
  <button class="btn btn--primary" id="publish-course">Опубликовать курс</button>
  <p class="muted">Публикация доступна, когда курс готов и назначен ревьюер.</p>
</div>
