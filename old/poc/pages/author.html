<h1>Мои курсы</h1>
<p class="muted">Здесь отображаются ваши курсы. Новый курс создаётся как черновик.</p>

<div class="card">
  <div class="card__head">
    <h2>Создать курс</h2>
  </div>
  <label class="field">
    <span class="field__label">Название курса</span>
    <input id="new-course-title" class="input" type="text" placeholder="Например, «Основы SQL»">
  </label>
  <label class="field">
    <span class="field__label">Описание (необязательно)</span>
    <textarea id="new-course-desc" class="input" rows="2" placeholder="О чём этот курс"></textarea>
  </label>
  <button class="btn btn--primary" id="create-course">Создать курс</button>
</div>

<div id="author-courses"></div>
