<div class="breadcrumb"><a href="#/review">Работы на ревью</a> / <span id="work-student-name"></span></div>

<div class="card">
  <div class="card__head">
    <h1 id="work-title"></h1>
    <span id="work-status"></span>
  </div>
  <div class="card__meta" id="work-meta"></div>
  <div class="work-content" id="work-content"></div>
</div>

<div class="card">
  <div class="card__head">
    <h2>Оставить ревью</h2>
  </div>
  <label class="field">
    <span class="field__label">Комментарий ревьюера</span>
    <textarea id="review-comment" class="input" rows="4" placeholder="Что нужно исправить или почему работа принята"></textarea>
  </label>
  <div class="btn-row">
    <button class="btn btn--success" id="approve-btn">Принять работу</button>
    <button class="btn btn--danger" id="changes-btn">Отправить на доработку</button>
  </div>
</div>

<div id="review-history"></div>
